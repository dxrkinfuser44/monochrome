name: native-platform-builds

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runs-on: ubuntu-latest
          - platform: linux
            runs-on: ubuntu-latest
          - platform: windows
            runs-on: windows-latest
          - platform: macos
            runs-on: macos-latest
          - platform: ios
            runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav libgstreamer-plugins-base1.0-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Shared web build
        run: bun run build

      - name: Prepare placeholder platform artifact
        run: |
          mkdir -p artifacts/${{ matrix.platform }}
          echo "Placeholder artifact for ${{ matrix.platform }} build. Replace with native pipeline once platform code is landed." > artifacts/${{ matrix.platform }}/README.txt
          tar -czf artifacts/${{ matrix.platform }}/bundle.tar.gz dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: monochrome-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/${{ matrix.platform }}
